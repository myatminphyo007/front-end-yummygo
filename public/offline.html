<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Yummy Go - Offline</title>
<style>
  :root{--wine:#922d4b;--rose:#df7189;--cream:#fffbf7;--text:#37252b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:var(--text);
       font-family:"Segoe UI","Noto Sans JP","Noto Sans KR","Noto Sans Myanmar",system-ui,sans-serif;text-align:center}
  .box{max-width:380px}
  img{width:120px;height:auto;margin:0 auto 14px;display:block;animation:bob 3s ease-in-out infinite}
  h1{margin:0 0 6px;font-size:26px;color:var(--wine)}
  p{margin:6px 0;line-height:1.6}
  small{display:block;color:#81747a;margin-top:10px}
  button{margin-top:18px;border:0;border-radius:999px;padding:12px 28px;background:var(--rose);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
  <div class="box">
    <img src="/mascot.png" alt="">
    <h1>オフラインです / You're offline</h1>
    <p>インターネットに接続してから、もう一度お試しください。</p>
    <p>Please check your connection and try again.</p>
    <small>인터넷 연결을 확인해 주세요 · အင်တာနက်ကို စစ်ဆေးပါ</small>
    <button onclick="location.reload()">Reload</button>
  </div>
</body>
</html>
